
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolución de la Pobreza en Argentina (1990-2024)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #f4f4f9; 
        }
        .chart-container { 
            width: 80%; 
            max-width: 900px; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        }
        canvas { 
            width: 100% !important; 
            height: auto !important; 
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <canvas id="pobrezaChart"></canvas>
        <p style="font-size: 12px; color: #666; text-align: center; margin-top: 10px; font-style: italic;">
            Fuentes: INDEC (EPH) y estimaciones del Observatorio de la Deuda Social Argentina (ODSA-UCA) y CEDLAS para cubrir el período de distorsión estadística (2007-2015). Los datos reflejan promedios anuales y mediciones de los primeros semestres en los años más recientes.
        </p>
    </div>
    <script>
        const ctx = document.getElementById('pobrezaChart').getContext('2d');
        
        const años = ['1990', '1992', '1994', '1996', '1998', '2000', '2002', '2004', '2006', '2008', '2010', '2012', '2014', '2016', '2018', '2020', '2022', '2023', '2024'];
        const valoresPobreza = [47.3, 19.5, 16.1, 27.9, 25.9, 28.9, 54.3, 44.3, 26.9, 27.8, 29.0, 26.6, 28.7, 30.3, 32.0, 42.0, 39.2, 41.7, 52.9];

        const data = {
            labels: años,
            datasets: [{
                label: 'Porcentaje de Pobreza (%)',
                data: valoresPobreza,
                borderColor: '#d32f2f',
                backgroundColor: 'rgba(211, 47, 47, 0.2)',
                borderWidth: 2,
                pointBackgroundColor: '#b71c1c',
                pointRadius: 4,
                pointHoverRadius: 6,
                fill: true,
                tension: 0.3
            }]
        };

        const config = {
            type: 'line',
            data: data,
            options: {
                responsive: true,
                plugins: {
                    title: { 
                        display: true, 
                        text: 'Evolución de la Pobreza en Argentina (1990 - 2024)', 
                        font: { size: 18 } 
                    },
                    tooltip: { 
                        mode: 'index', 
                        intersect: false,
                        callbacks: {
                            label: function(context) {
                                return context.parsed.y + '%';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 60,
                        title: { display: true, text: 'Población bajo la línea de pobreza (%)', font: { weight: 'bold' } }
                    },
                    x: {
                        title: { display: true, text: 'Año', font: { weight: 'bold' } }
                    }
                },
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                }
            }
        };

        new Chart(ctx, config);
    </script>
</body>
</html>
